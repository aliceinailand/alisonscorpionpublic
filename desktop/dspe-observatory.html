<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSPE Observatory — Alison Scorpion</title>
  <meta name="description" content="Local Dyarchic Synthetic Persona Emergence Observatory: ingest, measure, archive, and export persona signatures for AI, human, and experimental animal subjects." />
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root {
      color-scheme: dark;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      --bg: #0b0d12;
      --panel: #12161f;
      --panel-2: #171a21;
      --border: #2a3140;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --accent: #5b4bdb;
      --accent-2: #3d8bfd;
      --ok: #3dd68c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.45; min-height: 100dvh; }
    .wrap {
      width: min(1120px, 100% - 2rem);
      margin-inline: auto;
      padding-block: 1.25rem 2.5rem;
    }
    a { color: #9bbcff; }
    .nav { margin-block-end: 1rem; font-size: 0.9rem; }
    .obs-header h1 { font-size: clamp(1.35rem, 2vw, 1.75rem); margin: 0 0 0.35rem; letter-spacing: 0.01em; }
    .lede { color: var(--muted); margin: 0 0 1rem; max-width: 70ch; }
    .obs-tabs {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      margin-block-end: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.65rem;
    }
    .obs-tab, .obs-actions button, .obs-export button, .obs-archive-item {
      font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); min-height: 44px; padding: 0.45rem 0.9rem;
    }
    .obs-tab[aria-selected="true"] {
      background: var(--accent); border-color: transparent; color: #f7f5ff;
    }
    .obs-tab:focus-visible, .obs-actions button:focus-visible,
    .obs-export button:focus-visible, .obs-archive-item:focus-visible,
    textarea:focus-visible, select:focus-visible, input[type="file"]:focus-visible,
    .obs-drop:focus-visible {
      outline: 3px solid #9bbcff; outline-offset: 2px;
    }
    .obs-workspace {
      display: grid;
      gap: 1rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .obs-shell { display: block; }
    }
    .obs-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.1rem 1.25rem;
    }
    .field { display: flex; flex-direction: column; align-items: stretch; gap: 0.3rem; margin-block-end: 1rem; }
    fieldset.field { border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem; }
    legend, label { font-size: 0.95rem; }
    .hint { margin: 0; color: var(--muted); font-size: 0.85rem; }
    textarea, select, input[type="file"], pre {
      display: block; width: 100%; font: inherit; font-size: max(1rem, 1em);
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem; color: inherit;
    }
    textarea { resize: vertical; min-height: 12rem; }
    .obs-drop {
      border: 1.5px dashed var(--border); border-radius: 10px; padding: 1rem;
      margin-block-end: 1rem; color: var(--muted); background: #0e1219;
    }
    .obs-drop.dragover { border-color: var(--accent-2); color: var(--text); background: #152033; }
    .obs-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .obs-actions .primary {
      background: var(--accent); color: #f7f5ff; border-color: transparent; min-height: 48px;
    }
    .obs-scores {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr));
      gap: 0.55rem;
      margin-block-end: 1rem;
    }
    .obs-score-card {
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
      padding: 0.65rem 0.55rem; text-align: center;
    }
    .obs-score-card.composite { border-color: var(--ok); }
    .obs-score-id { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; }
    .obs-score-val { font-size: 1.35rem; font-variant-numeric: tabular-nums; font-weight: 650; }
    .obs-score-name { font-size: 0.72rem; color: var(--muted); }
    pre.report {
      white-space: pre-wrap;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.85rem; margin: 0 0 1rem;
      max-height: min(50vh, 28rem); overflow: auto;
    }
    .obs-export { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; }
    .obs-export button:disabled { opacity: 0.45; cursor: not-allowed; }
    .obs-archive { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.45rem; }
    .obs-archive-item { width: 100%; text-align: left; }
    .obs-panel h2 { font-size: 1.1rem; margin-top: 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="nav"><a href="index.html">← Desktop</a> · <a href="platform.html">Containers</a></p>
    <div id="dspe-root"></div>
  </main>
  <script type="module">
    import { mountObservatory } from "./js/dspe-observatory.js?v=20261114obs1";
    mountObservatory("#dspe-root");
  </script>
</body>
</html>
