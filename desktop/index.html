<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASX Desktop — Alison Scorpion</title>
  <meta name="description" content="Guest session on Alison Scorpion's desktop. Three.js universe · Containers · Honey Bee Engine." />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="asx-channel" content="desktop-os-apex" />
  <meta name="asx-build-stamp" content="20260810T064449Z-desktop" />
  <link rel="canonical" href="https://alisonscorpion.com/" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="stylesheet" href="css/asx-desktop.css" />
  <style>
    /* ensure resize handle doesn't steal body scroll */
    .asx-window .resize-handle { z-index: 2; }
  </style>
</head>
<body>
  <div id="boot-splash" class="boot-splash" aria-live="polite">
    <div class="logo">◆ ASX DESKTOP</div>
    <div class="sub">Initializing guest session…</div>
  </div>

  <canvas id="three-bg" aria-hidden="true"></canvas>

  <div id="desktop-layer" aria-label="Desktop"></div>
  <div id="windows-root" aria-live="polite"></div>

  <div id="start-menu" role="menu" aria-label="Start menu"></div>

  <footer id="taskbar">
    <button type="button" class="tb-start" id="tb-start">◆ ASX</button>
    <div id="taskbar-windows" style="display:flex;gap:6px;flex-wrap:nowrap;overflow:auto;max-width:55vw"></div>
    <div class="tb-spacer"></div>
    <span class="tb-status" title="Guest session">guest@asx</span>
    <span class="tb-clock" id="tb-clock">00:00:00</span>
  </footer>

  <!-- Three.js r128 from cdnjs (Claude extracts use same family) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
