name: Deploy Hybrid

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Run tests
        run: |
          if [ -f website/package.json ]; then
            cd website
            npm ci
            npm test
          else
            echo "No website/package.json found, skipping tests"
          fi
      
      - name: Build
        run: |
          if [ -f package.json ]; then
            npm run build
          else
            echo "No package.json found, skipping build"
          fi
      
      - name: Deploy to public repo
        run: |
          if [ -d website/dist ]; then
            cp -r website/dist/* "/"
          else
            echo "No website/dist directory found, skipping deploy"
          fi
