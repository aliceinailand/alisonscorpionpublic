# Apply Cloudflare Cache Rule for /safety/* (ASX desktop blocklist shards).
# Uses repo secret CLOUDFLARE_API_TOKEN (Zone → Cache Rules → Edit).
name: cf-safety-cache-rule

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "safety/**"
      - ".github/workflows/cf-safety-cache-rule.yml"
      - "tools/apply_cf_safety_cache_rule.py"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Cache Rule via Rulesets API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: fdfc2f6f3598393dc37bd9a4bed467b6
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret missing"
            exit 1
          fi
          python3 tools/apply_cf_safety_cache_rule.py
